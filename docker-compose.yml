services:
  app:
    build: .
    command: bun run start
    container_name: app
    hostname: container-1
    networks:
      - balancer-net
    env_file:
      - .env

  nginx:
    image: nginx:stable
    container_name: nginx-balancer
    depends_on:
      - app1
    volumes:
      - ./nginx/balancer.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "8080"
    ports:
      - "8080:80"
    networks:
      - balancer-net

networks:
  balancer-net:
    driver: bridge
