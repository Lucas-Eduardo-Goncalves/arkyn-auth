services:
  auth-app:
    build: .
    command: bun run start
    container_name: auth-app
    hostname: container-1
    networks:
      - balancer-auth
    env_file:
      - .env

  nginx:
    image: nginx:stable
    container_name: nginx-auth-balancer
    depends_on:
      - auth-app
    volumes:
      - ./nginx/balancer.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "8080"
    ports:
      - "8080:80"
    networks:
      - balancer-auth

networks:
  balancer-auth:
    driver: bridge
